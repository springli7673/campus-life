server:
  port: 8081

spring:
  application:
    name: campus-life
  datasource: #数据库
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_life?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
  data: #redis
    redis:
      host: 127.0.0.1
      port: 6379
      # Redis 有密码时用环境变量 REDIS_PASSWORD 覆盖；没有密码留空即可
      password: ${REDIS_PASSWORD:}
      lettuce: #redis连接池
        pool:
          max-active: 10  #最大连接数
          max-idle: 10  #最大空闲数
          min-idle: 1  #最小空闲数
          time-between-eviction-runs: 10s  #连接池空闲连接回收间隔时间
  #消息队列
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: "123456"
    virtual-host: /campus-life # 虚拟主机
    publisher-confirm-type: correlated #消息确认类型，correlated表示开启消息确认
    publisher-returns: true #开启消息返回，路由失败时返回消息
    template:
      mandatory: false # false：路由失败直接丢弃；true：触发return回调
    listener:
      simple:
        acknowledge-mode: auto # 自动ACK，消费成功自动告诉mq
        prefetch: 1 # 一次预取1条消息，公平分发
        retry:
          enabled: true # 开启消费者重试
          max-attempts: 3 # 最大重试次数
          initial-interval: 1s # 首次重试时间
          multiplier: 2 # 间隔时间倍增系数
          max-interval: 5s # 重试最大间隔上限
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB # 单个上传文件最大大小
      max-request-size: 10MB # 单次http请求总大小上限（可传多个文件总和）
#  json序列化配置
  jackson:
    default-property-inclusion: non_null # 序列化时忽略值为null的字段
    serialization:
      write-dates-as-timestamps: false # 日期不转时间戳，输出格式化日期字符串

#项目自定义配置
campus:
  upload:
    # 图片保存目录，可用环境变量 CAMPUS_UPLOAD_DIR 覆盖
    dir: ${CAMPUS_UPLOAD_DIR:./uploads}
  seckill:
    order-timeout-seconds: 1800 # 秒杀订单超时时间，单位秒，超时自动关闭订单释放库存
    timeout-scan-delay-ms: 300000 # 超时扫描间隔时间，单位毫秒
    # 限流：permits <= 0 表示关闭该维度
    rate-limit:
      user-permits: 5 # 单用户窗口内允许请求次数
      user-window-seconds: 2 # 单用户窗口时间，单位秒
      activity-permits: 5000 # 活动窗口内允许请求次数
      activity-window-seconds: 1 # 活动窗口时间，单位秒
  reconcile:
    enabled: true # 是否开启库存对账补偿任务
    interval-ms: 300000 # 对账间隔时间，单位毫秒

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.li.campuslife.entity
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰
# 日志级别
logging:
  level:
    com.li.campuslife: info
    # 开发时想在控制台看登录验证码，单独把发码的类开到 debug
    com.li.campuslife.service.impl.UserServiceImpl: debug
    org.springframework.amqp: info # rabbitmq相关框架日志级别